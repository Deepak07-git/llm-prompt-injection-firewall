{% extends "dashboard/base.html" %}
{% load static %}
{% block title %}Local AI Chat{% endblock %}
{% block content %}
<h1 class="page-title">LLM Firewall - Local AI Chatbot</h1>
<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <span>Model: {{ model }} <span class="badge badge-allow ms-2">Firewall: ACTIVE</span></span>
    <button id="clear-chat" class="btn btn-outline-secondary btn-sm">Clear conversation</button>
  </div>
  <div id="chat-messages" class="card-body" role="log" aria-live="polite" style="min-height:320px;max-height:60vh;overflow:auto"></div>
  <div class="card-body border-top">
    <form id="chat-form">{% csrf_token %}
      <label for="chat-message" class="form-label">Your message</label>
      <textarea id="chat-message" class="form-control" maxlength="16000" rows="3" placeholder="Type your message..." required></textarea>
      <div class="d-flex align-items-center justify-content-between mt-2">
        <span id="chat-status" role="status" class="text-dim small"></span>
        <button id="chat-send" class="btn btn-primary">Send</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="{% static 'js/chat.js' %}" defer></script>{% endblock %}
