{% extends "dashboard/base.html" %}
{% block title %}Analytics{% endblock %}
{% block content %}
<div class="page-title">Analytics</div>

<div class="row g-3 mb-3" id="kpiRow"></div>

<div class="row g-3">
  <div class="col-lg-6"><div class="card h-100"><div class="card-header">Top attack categories</div>
    <div class="card-body"><canvas id="catChart" height="180"></canvas></div></div></div>
  <div class="col-lg-6"><div class="card h-100"><div class="card-header">Risk-level distribution</div>
    <div class="card-body"><canvas id="levelChart" height="180"></canvas></div></div></div>
  <div class="col-lg-8"><div class="card h-100"><div class="card-header">Requests over time</div>
    <div class="card-body"><canvas id="timelineChart" height="140"></canvas></div></div></div>
  <div class="col-lg-4"><div class="card h-100"><div class="card-header">Top sources (IP)</div>
    <div class="card-body p-0"><table class="table table-sm mb-0" id="sourceTable"><tbody></tbody></table></div></div></div>
</div>
{% endblock %}

{% block scripts %}
<script>
const AXIS = { scales: { x: { grid: { color: '#232c3f' } }, y: { grid: { color: '#232c3f' } } } };
async function load() {
  const d = await (await fetch('/api/analytics/')).json();
  document.getElementById('kpiRow').innerHTML = [
    ['Total', d.total_requests], ['Avg latency (ms)', d.avg_latency_ms],
    ['False positives', d.false_positives], ['False negatives', d.false_negatives],
  ].map(([l, v]) => `<div class="col"><div class="kpi"><div class="label">${l}</div><div class="value">${v}</div></div></div>`).join('');

  const cats = d.top_attack_categories || [];
  new Chart(catChart, { type: 'bar',
    data: { labels: cats.map(c => c[0]), datasets: [{ data: cats.map(c => c[1]), backgroundColor: '#3b82f6' }] },
    options: { indexAxis: 'y', plugins: { legend: { display: false } }, ...AXIS } });

  const lvl = d.by_risk_level || {};
  new Chart(levelChart, { type: 'bar',
    data: { labels: Object.keys(lvl), datasets: [{ data: Object.values(lvl),
      backgroundColor: ['#9ca3af', '#4ade80', '#fbbf24', '#f87171', '#ef4444'] }] },
    options: { plugins: { legend: { display: false } }, ...AXIS } });

  const tl = d.timeline || [];
  new Chart(timelineChart, { type: 'line',
    data: { labels: tl.map(x => x.day), datasets: [{ label: 'Requests', data: tl.map(x => x.count),
      borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,.15)', fill: true, tension: .3 }] },
    options: { plugins: { legend: { display: false } }, ...AXIS } });

  document.querySelector('#sourceTable tbody').innerHTML = (d.top_sources || [])
    .map(s => `<tr><td class="mono small">${s.ip_address}</td><td class="text-end">${s.n}</td></tr>`).join('')
    || '<tr><td class="text-dim p-3">No data</td></tr>';
}
load();
</script>
{% endblock %}
