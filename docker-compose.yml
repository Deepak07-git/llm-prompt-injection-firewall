services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: firewall
      POSTGRES_USER: firewall
      POSTGRES_PASSWORD: firewall
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firewall"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-prod}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "*"
      DB_ENGINE: postgres
      DB_HOST: db
      DB_NAME: firewall
      DB_USER: firewall
      DB_PASSWORD: firewall
      REDIS_URL: redis://redis:6379/0
      CLASSIFIER_PROVIDER: ${CLASSIFIER_PROVIDER:-}
      CLASSIFIER_API_KEY: ${CLASSIFIER_API_KEY:-}
    ports:
      - "8000:8000"

volumes:
  pgdata:
